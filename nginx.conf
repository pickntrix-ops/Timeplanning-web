server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A bare `types {}` block here would *replace* nginx's whole default
    # MIME map (from the outer http block's own `include mime.types`), not
    # add to it — found that the hard way: it served index.html and
    # shared.js as application/octet-stream. Nginx's default mime.types has
    # mapped .wasm to application/wasm since 1.19.1, so nothing extra is
    # needed here at all.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
